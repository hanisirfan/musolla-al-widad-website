<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgQuran" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c5c"/>
      <stop offset="100%" stop-color="#fb8b24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgQuran)"/>
  <!-- Decorative pattern -->
  <circle cx="150" cy="100" r="80" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="680" cy="340" r="120" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Quran Illustration -->
  <g transform="translate(400, 210)">
    <rect x="-100" y="-80" width="200" height="150" rx="16" fill="#1b4965" stroke="#f4a261" stroke-width="4"/>
    <rect x="-85" y="-65" width="170" height="120" rx="10" fill="#2c698d"/>
    <circle cx="0" cy="-5" r="35" fill="none" stroke="#f4a261" stroke-width="3"/>
    <circle cx="0" cy="-5" r="25" fill="#f4a261" fill-opacity="0.3"/>
    <text x="0" y="2" font-family="serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">القرآن</text>
  </g>

  <rect x="180" y="375" width="440" height="50" rx="25" fill="#000000" fill-opacity="0.5"/>
  <text x="400" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">KELAS AL-QURAN &amp; FARDHU AIN</text>
</svg>
