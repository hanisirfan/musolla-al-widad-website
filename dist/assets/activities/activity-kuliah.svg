<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKuliah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072e38"/>
      <stop offset="50%" stop-color="#0c5966"/>
      <stop offset="100%" stop-color="#147d8e"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgKuliah)"/>
  <!-- Lantern glow -->
  <circle cx="400" cy="180" r="180" fill="url(#lampGlow)"/>

  <!-- Islamic Arch Structure -->
  <path d="M 250 450 L 250 250 Q 250 120 400 90 Q 550 120 550 250 L 550 450 Z" fill="none" stroke="#e67e22" stroke-width="4" stroke-opacity="0.4"/>
  <path d="M 270 450 L 270 260 Q 270 140 400 115 Q 530 140 530 260 L 530 450 Z" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6" stroke-opacity="0.6"/>

  <!-- Hanging Lantern -->
  <line x1="400" y1="0" x2="400" y2="130" stroke="#f59e0b" stroke-width="3"/>
  <polygon points="385,130 415,130 425,165 400,185 375,165" fill="#f59e0b"/>
  <circle cx="400" cy="155" r="10" fill="#ffffff"/>

  <!-- Open Quran on Rehal (Stand) -->
  <g transform="translate(400, 310)">
    <!-- Book pages -->
    <path d="M -90 -20 Q -45 -35 0 0 Q 45 -35 90 -20 L 80 40 Q 40 25 0 50 Q -40 25 -80 40 Z" fill="#fef3c7"/>
    <path d="M 0 0 L 0 50" stroke="#d97706" stroke-width="2"/>
    <!-- Rehal stand -->
    <polygon points="-70,45 -20,75 -35,90 -85,60" fill="#b45309"/>
    <polygon points="70,45 20,75 35,90 85,60" fill="#92400e"/>
  </g>

  <!-- Title Badge -->
  <rect x="220" y="375" width="360" height="50" rx="25" fill="#000000" fill-opacity="0.5"/>
  <text x="400" y="407" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">KULIAH MAGHRIB MINGGUAN</text>
</svg>
